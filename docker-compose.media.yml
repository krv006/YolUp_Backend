# MEDIA server (netcup RS 4000): jonli dars video/ovoz (LiveKit) + dars yozuvlari (qabul qilish, birlashtirish, MP4 ga
# o'tkazish, fayllarni saqlash va berish). Sayt/chat/baza BU YERDA EMAS — ular APP (CORE) serverda (docker-compose.app.yml).
#
# Ustuvorlik qoidasi: jonli dars hech qachon och qolmasin. LiveKit eng yuqori CPU ulushiga ega (cpu_shares), yozuvni
# o'tkazish (og'ir ish) eng pasti va yadro soni bilan cheklangan — dars paytida video o'tkazish darsni sekinlashtirmaydi.
#
# Ishga tushirish (serverda, /var/www/edu_platform ichida; AVVAL WireGuard ulangan va APP server ishlab turgan bo'lishi kerak):
#   cp .env.media.example .env    # va qiymatlarni to'ldiring (APP serverdagi .env bilan bir xil kalitlar!)
#   docker compose -f docker-compose.media.yml up -d --build
#
# DNS: LK_DOMAIN (masalan lk.thesofmebel.uz) A-yozuvi SHU serverning IP'siga yo'naltirilgan bo'lishi shart
# (Caddy sertifikatni shu orqali oladi).

x-backend: &backend
  build: .
  image: edu-app:latest
  restart: unless-stopped
  env_file: .env
  environment: &backend-env
    DJANGO_ENV: prod
    # Baza va Redis APP serverda — WireGuard kanali orqali (internet orqali emas)
    POSTGRES_HOST: ${CORE_WG_IP:-10.10.0.1}
    REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD .env da berilishi shart}@${CORE_WG_IP:-10.10.0.1}:6379/0
    RECORDINGS_DIR: /app/recordings
    RECORDINGS_LOCAL: "1"    # yozuv fayllari aynan shu serverda
    SERVER_ROLE: media
  volumes:
    - recordings:/app/recordings
    - logs:/app/logs

services:
  livekit:
    # Versiya qotirilgan. Agar `manifest unknown` chiqsa, .env da LIVEKIT_VERSION=1.13.4 (`v`siz) deb sinab ko'ring.
    image: livekit/livekit-server:${LIVEKIT_VERSION:-v1.13.4}
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    cpu_shares: 4096        # CPU talashganda eng ustuvor (standart 1024)
    environment:
      # Format muhim: "kalit: sekret" (ikki nuqtadan keyin probel). APP serverdagi .env bilan AYNAN bir xil bo'lishi shart.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}"
    # HOST tarmog'i: Docker NAT'siz. Yuk sinovi (2026-10-31): xuddi shu mashinada 800 ta yuqori sifatli tomoshabin —
    # Docker tarmog'ida 177 Mbit/s va 26% paket yo'qotish, host tarmog'ida 592 Mbit/s va 1.9%. Bonus: portlar endi `ufw` orqali
    # boshqariladi (Docker o'zi ochgan portlar ufw'ni chetlab o'tadi): kerakli portlar ufw'da ochiq bo'lishi shart:
    # 7881/tcp (TCP fallback), 7882/udp (WebRTC media, UDP mux). TURN yoqilsa: 3478/udp va 5349/tcp'ni ufw'da oching.
    network_mode: host
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./deploy/media/livekit.yaml:/etc/livekit.yaml:ro

  # Yozuv API'si: o'qituvchi brauzeridan video/audio bo'laklarni qabul qiladi, birlashtiradi (ffmpeg -c copy), yozuvni
  # tomoshabinlarga beradi. APP serverdagi Caddy /api/v1/lessons/<id>/recording* so'rovlarini shu yerga yuboradi.
  # Faqat WireGuard manzilida tinglaydi (internetga ochiq emas). Migratsiyani APP serverdagi `web` bajaradi — avval APP'ni
  # yangilang, keyin shu serverni.
  rec:
    <<: *backend
    cpus: ${REC_CPUS:-3}
    cpu_shares: 1024
    ports:
      - "${MEDIA_WG_IP:-10.10.0.2}:8000:8000"
    command: >
      sh -c "gunicorn root.wsgi:application -k gthread --bind 0.0.0.0:8000 --workers ${REC_WORKERS:-4} --threads ${REC_THREADS:-16} --timeout 120 --worker-tmp-dir /dev/shm"

  # Yozuv serveridagi davriy vazifalar: qotib qolgan yozuvni tiklash, yetim fayllarni tozalash, disk ogohlantirishi.
  # (Faylsiz vazifalar — eslatmalar, AI va h.k. — APP serverda.) REC_JOBS dan prune_orphan_recordings / prune_recordings ni olib
  # tashlasangiz, tegishli fayl o'chirish o'chadi. prune_recordings: 7 kundan eski tayyor yozuvlarning xom qismlari va MP4 tayyor
  # bo'lgan asl WebM'i (disk to'lib qolmasligi uchun: kuniga 13–100 GB yozuv, qarang STRESS_TEST_NATIJALARI_2026-10-31.md).
  rec-cron:
    <<: *backend
    cpu_shares: 256
    command: python manage.py run_scheduler --startup-delay 30 --only ${REC_JOBS:-recover_recordings,prune_orphan_recordings,prune_recordings,check_disk,watchdog}

  # Yozuvni MP4 (iOS uchun) ga o'tkazadi — og'ir ish: yadro soni va ustuvorligi cheklangan, bitta-bitta ishlaydi.
  transcoder:
    <<: *backend
    # Yuk sinovi (2026-10-31, 30 daqiqalik 720p dars): 1 ish/3 yadro = 12.8x real vaqt (2 soatlik dars ~9 daqiqa), 1 ish/6 yadro = 26.5x,
    # 2 ish/6 yadrodan = umumiy 39.5x (3x ko'p dars). Shuning uchun standart: 10 yadro, 2 ta parallel ish. Jonli dars baribir ustun
    # (cpu_shares 256 va nice 15): LiveKit CPU so'rasa, o'tkazish unga joy beradi.
    cpus: ${TRANSCODER_CPUS:-10}
    cpu_shares: 256         # CPU talashganda eng pasti: avval jonli dars, keyin yozuvni o'tkazish
    # DIQQAT: buyruq BITTA qatorda bo'lishi shart (`>` blokida chuqurroq qator yangi qator bo'lib qoladi). Yozuvni "converting" deb
    # belgilash atomik (apps/lessons/transcode.py), shuning uchun parallel ishlar bir yozuvni ikki marta olmaydi.
    command: >
      sh -c "sleep 60 && for i in $$(seq 1 ${TRANSCODER_WORKERS:-2}); do (while true; do nice -n 15 python manage.py convert_recordings --limit 1; sleep 10; done) & sleep 7; done; wait"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LK_DOMAIN: ${LK_DOMAIN:?LK_DOMAIN .env da berilishi shart}
    # HOST tarmog'i: LiveKit ham host'da, Caddy 127.0.0.1:7880 ga ulanadi. 80/443 (tcp+udp) ufw'da ochiq.
    network_mode: host
    volumes:
      - ./deploy/media:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - livekit

volumes:
  recordings:
  logs:
  caddy_data:
  caddy_config:
