# Production — edu.thesofmebel.uz
# Ishga tushirish (serverda):
#   cp .env.prod.example .env   # va qiymatlarni to'ldiring
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edtech}
      POSTGRES_USER: ${POSTGRES_USER:-edtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da berilishi shart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edtech} -d ${POSTGRES_DB:-edtech}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # RAM chegarasi — channels/cache kalitlari TTL'li, volatile-ttl xavfsiz
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-ttl

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      # Format muhim: "kalit: sekret" (ikki nuqtadan keyin probel)
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}"
    ports:
      - "7881:7881"        # WebRTC TCP fallback
      - "7882:7882/udp"    # WebRTC media (UDP mux — bitta port, port range emas)
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_ENV: prod
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      RECORDINGS_DIR: /app/recordings
      # Server-server LiveKit API — Caddy/TLS orqali emas, to'g'ridan-to'g'ri
      LIVEKIT_API_URL: http://livekit:7880
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn root.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    volumes:
      - media:/app/media
      - logs:/app/logs   # log fayllar konteyner qayta yaratilsa ham saqlanadi
      - recordings:/app/recordings   # o'qituvchi brauzeridan yuklangan video/audio (faqat auth stream orqali beriladi)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Davriy vazifalar (auto_finish_expired_lessons, send_deadline_reminders).
  # Loyihada Celery/Celery Beat yo'q — shu konteyner backend bilan bir xil
  # image'ni ishlatib, oddiy sleep-tsikl bilan cron o'rnini bosadi.
  # DIQQAT (2026-09-05 topilgan): bu xizmat AVVAL UMUMAN YO'Q EDI —
  # `auto_finish_expired_lessons` (o'qituvchi "Yakunlash"ni bosmay
  # ketgan darslarni avtomatik yopadigan, video yozuvni ham finalize
  # qiladigan xavfsizlik to'ri) kodda yozilgan bo'lsa-da, uni ishga
  # tushiradigan HECH QANDAY cron/timer production'da sozlanmagan edi —
  # shu sabab bunday darslar va ularning video yozuvlari abadiy
  # "live"/"recording" holatida qotib qolar edi.
  cron:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_ENV: prod
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      RECORDINGS_DIR: /app/recordings
      LIVEKIT_API_URL: http://livekit:7880
    # `send_lesson_reminders` alohida, tezroq (60s) siklda — foydalanuvchi
    # o'zi tanlagan eslatma vaqti (`lesson_reminder_minutes`) daqiqa
    # aniqligida bo'lishi kerak; 300s sikl uni 5 daqiqagacha kechiktirar edi.
    command: >
      sh -c "sleep 30 &&
             (while true; do
               python manage.py auto_finish_expired_lessons;
               python manage.py send_deadline_reminders;
               sleep 300;
             done) &
             while true; do
               python manage.py send_lesson_reminders;
               sleep 60;
             done"
    volumes:
      - media:/app/media
      - logs:/app/logs
      - recordings:/app/recordings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    # Frontend alohida loyihaga ko'chirildi — Caddy endi faqat TLS + API proxy
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-edu.thesofmebel.uz}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media:/srv/media:ro
      # Smart Project (systemd gunicorn) — unix socket + statik fayllar
      - /var/www/smart_project/run:/run/smart_project
      - /var/www/smart_project/staticfiles:/srv/smart_static:ro
    networks:
      - default
      - navigo   # Navigo CRM nginx'iga proxy uchun (Caddyfile'dagi navigocrm bloki)
      - eslatbot # Eslat bot adminkasiga proxy uchun (Caddyfile'dagi eslat bloki)
    depends_on:
      - backend
      - livekit

volumes:
  pgdata:
  media:
  logs:
  recordings:
  caddy_data:
  caddy_config:

networks:
  # Boshqa loyihalarning tarmoqlari — shu serverda allaqachon mavjud.
  # Yangi serverda bo'lmasa: `docker network create <nom>` yoki shu bo'limlar +
  # caddy'dagi `networks:` yozuvlarini olib tashlang.
  navigo:
    external: true
  eslatbot:
    name: eslat_bot_default
    external: true
