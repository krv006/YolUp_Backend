# LiveKit production config.
# Kalitlar LIVEKIT_KEYS env orqali beriladi (docker-compose.prod.yml -> .env).
# Signaling (7880) tashqariga ochilmaydi — Caddy /livekit orqali proxy qiladi.
port: 7880
rtc:
  tcp_port: 7881
  # UDP mux — barcha WebRTC media BITTA portdan o'tadi (port range emas).
  # 2026-09-05: `port_range_start/end` (50000-51000) da har bir ishtirokchi
  # ulanishi alohida port band qilar edi — bu ~30-50 parallel darsdan keyin
  # portlar tugab qolishiga olib kelardi (server qanchalik kuchli bo'lishidan
  # qat'iy nazar). `udp_port` o'rnatilsa, `port_range_start/end` ishlatilmaydi
  # (LiveKit hujjati: docs.livekit.io/home/self-hosting/ports-firewall) —
  # LiveKit Cloud'ning o'zi ham xuddi shu usul (ICE/UDP mux) bilan miqyoslanadi.
  udp_port: 7882
  # Serverning tashqi IP sini STUN orqali avtomatik aniqlaydi.
  # Ishlamasa: docker-compose.prod.yml da command ga --node-ip <SERVER_PUBLIC_IP> qo'shing.
  use_external_ip: true
# --- TURN (ixtiyoriy, hozir O'CHIRILGAN) ---------------------------------------------------------------
# Kerak bo'lganda: o'quvchi tarmog'i UDP va 7881/tcp ni to'sib, faqat 443 ni ochiq qoldirsa (ba'zi maktab/ofis tarmoqlari).
# Yoqish uchun: 1) DNS'da `turn.<domen>` A yozuvi shu serverga; 2) serverda 5349/tcp va 3478/udp ochiq (ufw);
# 3) TLS sertifikat (Caddy'ning `turn.<domen>` uchun olganini ulashing) fayllarini konteynerga ulang;
# 4) quyidagi blokni izohdan chiqaring va `docker compose ... up -d livekit`. Keyin telefondan mobil internetda
# va boshqa tarmoqda dars sinab ko'ring. Sinalmagan holda yoqmang — noto'g'ri sozlash LiveKit'ni ishga tushirmaydi.
# turn:
#   enabled: true
#   domain: turn.edu.thesofmebel.uz
#   tls_port: 5349
#   udp_port: 3478
#   cert_file: /etc/turn/fullchain.pem
#   key_file: /etc/turn/privkey.pem
# Egress (dars video yozuvi) server bilan Redis orqali gaplashadi
redis:
  address: redis:6379
# Resurs tejash: bo'sh xona 5 daqiqada yopiladi (RAM bo'shaydi),
# hamma chiqib ketgach 20 soniyada yakunlanadi
room:
  empty_timeout: 300
  departure_timeout: 20
logging:
  level: info
