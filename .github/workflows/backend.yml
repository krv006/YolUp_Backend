name: Backend

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      # Yozuvni birlashtirish testlari haqiqiy ffmpeg/ffprobe/mkvmerge bilan ishlaydi (Dockerfile'dagi bilan bir xil)
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix gettext

      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints.txt

      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run
        env:
          POSTGRES_DB: ""

      - name: Django system check
        run: python manage.py check
        env:
          POSTGRES_DB: ""

      - name: Compile translations
        run: python manage.py compilemessages

      # POSTGRES_DB bo'sh => sqlite (lokal ishlatilgan usul bilan bir xil)
      - name: Tests
        run: python manage.py test --parallel 4
        env:
          POSTGRES_DB: ""

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Zaiflik topilsa ham PR'ni to'xtatmaydi (twisted'ning tuzatmasi hali beta) — natijani ko'rsatadi
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit && pip-audit -r requirements.txt --progress-spinner off
