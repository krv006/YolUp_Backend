# AI-home-checker-multi-model (RJalol/AI-home-checker-multi-model, `main`) — uy vazifasini (matn, rasm, DOCX va
# Speaking AUDIO) AI bilan tekshiruvchi ALOHIDA xizmat.
# Asosiy docker-compose.app.yml'dan mustaqil: bu fayl ishlamasa ham platforma ishlayveradi
# (uy vazifasi o'qituvchiga qo'lda baholashga tushadi).
#
# Ishga tushirish (APP serverda, /var/www/edu_platform ichida):
#   docker compose -f deploy/ai-home-checker/docker-compose.ai.yml \
#       --env-file /var/www/ai-home-checker/.env up -d --build
# To'liq qadamlar: deploy/ai-home-checker/README.md
#
# Tashqariga PORT OCHILMAYDI — xizmatga faqat bizning backend ichki Docker tarmog'i orqali
# (http://checker-api:8000) murojaat qiladi.
#
# Yangi servis ko'p-provayderli (tiered pipeline): MODEL_BACKEND bermaymiz (standart `auto`) — qaysi provayder kaliti
# bo'lsa shu ishlatiladi. Faqat Gemini audioni o'qiydi, shuning uchun Speaking uchun GEMINI_API_KEY shart.
name: ai_checker

x-checker: &checker
  build:
    context: ${CHECKER_SRC:-/var/www/ai-home-checker}
    dockerfile_inline: |
      FROM python:3.12-slim
      WORKDIR /app
      COPY requirements.txt .
      RUN pip install --no-cache-dir -r requirements.txt
      COPY . .
      # `.env` (kalitlar) image ichiga tushib qolmasin — sozlamalar runtime'da env orqali beriladi
      RUN rm -f .env
  restart: unless-stopped
  environment:
    # Speaking (audio) va Listening uchun shart; boshqa provayderlar ixtiyoriy (bo'sh = o'sha daraja o'tkazib yuboriladi)
    GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY .env da berilishi shart}
    QWEN_API_KEY: ${QWEN_API_KEY:-}
    GLM_API_KEY: ${GLM_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OPENAI_API_KEY: ${CHECKER_OPENAI_API_KEY:-}
    # SHART: bo'sh bo'lsa barcha himoyalangan endpointlar 503 beradi
    INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY .env da berilishi shart}
    DATABASE_URL: postgresql+psycopg2://checker:${CHECKER_DB_PASSWORD:?CHECKER_DB_PASSWORD .env da berilishi shart}@checker-db:5432/homework_checker
    REDIS_URL: redis://checker-redis:6379/0
    FEEDBACK_LANGUAGE: ${FEEDBACK_LANGUAGE:-Uzbek (Latin script)}
    # Bolalarning topshiriqlari "o'qitish ma'lumotlari" papkasiga nusxalanmasin
    COLLECT_TRAINING_DATA: "false"
    ENABLE_CONTEXT_CACHING: ${ENABLE_CONTEXT_CACHING:-true}
    # Speaking har doim Gemini'ga yo'naltiriladi (boshqa provayderlar audioni o'qiy olmaydi)
    FORCE_GEMINI_FOR_SPEAKING: "true"
  volumes:
    - checker_uploads:/app/uploads
    - checker_reports:/app/reports
    - checker_training:/app/training_data
  depends_on:
    checker-db:
      condition: service_healthy
    checker-redis:
      condition: service_started

services:
  checker-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homework_checker
      POSTGRES_USER: checker
      POSTGRES_PASSWORD: ${CHECKER_DB_PASSWORD:?CHECKER_DB_PASSWORD .env da berilishi shart}
    volumes:
      - checker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checker -d homework_checker"]
      interval: 5s
      timeout: 3s
      retries: 10

  checker-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy volatile-ttl

  checker-api:
    <<: *checker
    # Jadvallarni yaratadi (mavjud bo'lsa tegmaydi), keyin API'ni ishga tushiradi
    command: >
      sh -c "python -c 'from db import init_db; init_db()' &&
             uvicorn api:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      default: {}
      edu:
        aliases:
          - checker-api

  checker-worker:
    <<: *checker
    # Baholash navbatini (Redis) ishlovchi jarayon; `webhook_delivery` — natijani yuboruvchi navbat;
    # `--with-scheduler` — qayta urinishlar jadvali uchun (servis README'sidagi Procfile bilan bir xil)
    command: sh -c 'rq worker homework_grading webhook_delivery --with-scheduler --url "$$REDIS_URL"'

  # Qotib qolgan topshiriqlarni qayta navbatga qo'yadi (worker o'chib qolsa, topshiriq abadiy "pending_ai" bo'lib qolmasin)
  checker-reconciler:
    <<: *checker
    command: python reconcile.py --loop 60

volumes:
  checker_pgdata:
  checker_uploads:
  checker_reports:
  checker_training:

networks:
  # Bizning backend turgan tarmoq (docker-compose.app.yml, loyiha nomi `edu_platform`)
  edu:
    name: edu_platform_default
    external: true
