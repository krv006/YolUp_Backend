# Test-creator (RJalol/Test-creator) — standartga asoslangan savollar banki va test generatori.
# ALOHIDA xizmat: asosiy docker-compose.prod.yml'dan mustaqil (u ishlamasa platforma ishlayveradi).
#
# Ishga tushirish (serverda, /var/www/edu_platform ichida):
#   docker compose -f deploy/test-creator/docker-compose.tc.yml \
#       --env-file /var/www/test-creator/.env up -d --build
# To'liq qadamlar (DNS, patch, .env): deploy/test-creator/README.md
#
# Tashqariga PORT OCHILMAYDI (baza, Redis, API, frontend) — hammasiga faqat bizning Caddy
# `edu_platform_default` tarmog'i orqali kiradi: https://${TC_DOMAIN}  (/api/* -> tc-api, qolgani -> tc-frontend).
name: test_creator

x-tc-backend: &tc-backend
  build:
    context: ${TC_SRC:-/var/www/test-creator}/backend
  restart: unless-stopped
  env_file: ${TC_ENV_FILE:-/var/www/test-creator/.env}
  environment:
    DATABASE_URL: postgresql+psycopg://qbank:${TC_DB_PASSWORD:?TC_DB_PASSWORD .env da berilishi shart}@tc-db:5432/qbank
    REDIS_URL: redis://tc-redis:6379/0
    ENVIRONMENT: production
    DEBUG: "false"
    AI_DEFAULT_PROVIDER: gemini
    CORS_ORIGINS: '["https://${TC_DOMAIN:-tests.thesofmebel.uz}"]'
  volumes:
    - tc_storage:/app/storage
  depends_on:
    tc-db:
      condition: service_healthy
    tc-redis:
      condition: service_healthy

services:
  tc-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: qbank
      POSTGRES_PASSWORD: ${TC_DB_PASSWORD:?TC_DB_PASSWORD .env da berilishi shart}
      POSTGRES_DB: qbank
    volumes:
      - tc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qbank"]
      interval: 5s
      timeout: 5s
      retries: 10

  tc-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  tc-api:
    <<: *tc-backend
    # Migratsiya va boshlang'ich ma'lumotlar (UZBMB, IELTS Academic, Digital SAT standartlari) — qayta
    # ishga tushirilsa takrorlanmaydi
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.seed_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      default: {}
      edu:
        aliases:
          - tc-api

  tc-worker:
    <<: *tc-backend
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2

  tc-frontend:
    build:
      context: ${TC_SRC:-/var/www/test-creator}/frontend
      dockerfile_inline: |
        FROM node:20-slim
        WORKDIR /app
        COPY . .
        # Kompyuterdan nusxalangan node_modules/.next bo'lsa, ular Linux uchun yaroqsiz
        RUN rm -rf node_modules .next && npm install
        # NEXT_PUBLIC_* qiymat yig'ish paytida kodga "pishiriladi" (brauzer shu manzilga murojaat qiladi)
        ARG NEXT_PUBLIC_API_URL
        ENV NEXT_PUBLIC_API_URL=$$NEXT_PUBLIC_API_URL
        RUN npm run build
        ENV NODE_ENV=production
        EXPOSE 3000
        CMD ["npm", "run", "start", "--", "-H", "0.0.0.0", "-p", "3000"]
      args:
        NEXT_PUBLIC_API_URL: https://${TC_DOMAIN:-tests.thesofmebel.uz}/api/v1
    restart: unless-stopped
    depends_on:
      - tc-api
    networks:
      default: {}
      edu:
        aliases:
          - tc-frontend

volumes:
  tc_pgdata:
  tc_storage:

networks:
  # Bizning backend va Caddy turgan tarmoq (docker-compose.prod.yml, loyiha nomi `edu_platform`)
  edu:
    name: edu_platform_default
    external: true
